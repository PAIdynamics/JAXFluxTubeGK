.find_commits_in_branch: &find_commits_in_branch |
    source confix/cmake/functions/gxload.sh
    gxload python
    LAST_MERGED=$(git log --pretty=format:"%H" --merges -n 1)
    NCOMMIT=$(git rev-list --count HEAD ^${LAST_MERGED})
    LHASHES=($(git log --pretty=format:'%H' -n $NCOMMIT))
    SHASHES=($(git log --pretty=format:'%h' -n $NCOMMIT))
    ABORT=false

.assert_git_hook_job: &assert_git_hook_job |
    if ${ABORT}; then
      echo -e "${BOLDRED}The pipeline failed! Fix the error messages"\
               "above!${NC}"
      exit 1
    fi

.test_template_git_commit: &git_commit_msg_definition
    stage: git-hooks
    tags:
        - modules
    variables:
      GIT_SUBMODULE_FORCE_HTTPS: true
    script:
        - *find_commits_in_branch
        - >
          for i in $(seq 0 $(($NCOMMIT-1))); do
            STATUS=false
            echo -e "Commit ${SHASHES[$i]}: ${BROWN}Checking ...${NC}"
            git log --format=%B -n1 ${LHASHES[$i]} &> commit_to_check
            bash ./.git-hooks/commit-msg commit_to_check | sed 's/^/>> /' || STATUS=true
            if ${STATUS}; then
              echo -e "Commit ${SHASHES[$i]}: ${RED}Failed!${NC}"
              ABORT=true
            else
              echo -e "Commit ${SHASHES[$i]}: ${GREEN}Passed!${NC}"
            fi
          done
        - *assert_git_hook_job

.test_template_git_pre_commit: &git_pre_commit_definition
    stage: git-hooks
    tags:
        - modules
    variables:
      GIT_SUBMODULE_FORCE_HTTPS: true
    script:
        - *find_commits_in_branch
        - |
          STATUS=false
          if (( ${NCOMMIT} > 0 )); then
            echo -e "${BOLDBROWN}Checking the code standard throughout the"\
                    "source files"
            git log --format=%B -n1 ${LHASHES[-1]} &> commit_to_check
            bash ./.git-hooks/pre-commit --full | sed 's/^/>> /' || STATUS=true
            if ${STATUS}; then
              echo -e "Commit ${SHASHES[-1]}: ${RED}Failed!${NC}"
              ABORT=true
            else
              echo -e "Commit ${SHASHES[-1]}: ${GREEN}Passed!${NC}"
            fi
          fi
        - *assert_git_hook_job

git-commit-msg:
  <<: *git_commit_msg_definition
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: never
    - when: always

git-pre-commit:
  <<: *git_pre_commit_definition
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: never
    - when: always
