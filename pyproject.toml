[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-fluxtube-gk"
version = "0.1.0"
description = "Differentiable local flux-tube gyrokinetics for magnetic-confinement design"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
desc = [
  "desc-opt",
]
gvec = [
  "gvec",
]
vmecpp = [
  "vmecpp",
]
dev = [
  "matplotlib>=3.8",
  "netCDF4>=1.7",
  "pytest>=8",
  "ruff>=0.6",
]
reference = [
  "einops>=0.8",
  "omegaconf>=2.3",
]
mhd = [
  "desc-opt",
  "gvec",
  "vmecpp",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_fluxtube_gk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repository tests exercise non-installed validation tooling under scripts/.
pythonpath = ["src", "."]
addopts = "-ra -m 'not external'"
markers = [
  "external: requires an explicitly configured, revision-pinned external dependency",
]

[tool.ruff]
line-length = 100
