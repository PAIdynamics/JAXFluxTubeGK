stages:
  - git-hooks
  - build
  - unit-tests
  - mms-tests
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /^($expt$)/
      when: never
    - if: $CI_COMMIT_BRANCH =~ /(junk)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  GIT_SUBMODULE_STRATEGY: recursive

include:
  - local: 'cicd/templates.yml'
  - local: 'cicd/git_hooks_jobs.yml'
  - local: 'cicd/build_jobs.yml'
  - local: 'cicd/unit_test_jobs.yml'
  - local: 'cicd/mms_broad_jobs.yml'
  - local: 'cicd/mms_deep_jobs.yml'
  - local: 'cicd/deploy_jobs.yml'
