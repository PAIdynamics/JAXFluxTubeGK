[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-fluxtube-gk"
version = "0.1.0"
description = "Differentiable local flux-tube gyrokinetics for magnetic-confinement design"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "JAXFluxTubeGK contributors" }]
keywords = ["jax", "gyrokinetics", "plasma-physics", "stellarator", "tokamak"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
desc = [
  "desc-opt",
]
gvec = [
  "gvec",
]
vmecpp = [
  "vmecpp",
]
dev = [
  "matplotlib>=3.8",
  "netCDF4>=1.7",
  "pytest>=8",
  "ruff>=0.6",
]
reference = [
  "einops>=0.8",
  "omegaconf>=2.3",
]
mhd = [
  "desc-opt",
  "gvec",
  "vmecpp",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_fluxtube_gk*"]

[tool.setuptools.package-data]
jax_fluxtube_gk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repository tests exercise non-installed validation tooling under scripts/.
pythonpath = ["src", "."]
addopts = "-ra -m 'not external'"
markers = [
  "external: requires an explicitly configured, revision-pinned external dependency",
]

[tool.ruff]
line-length = 100
