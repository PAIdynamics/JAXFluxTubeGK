<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">JAXFluxTubeGK in a differentiable fusion-device design loop</title>
  <desc id="description">A flowchart showing device parameters passing through equilibrium solvers and a geometry-provider interface into JAXFluxTubeGK. Physics objectives and gradients feed an optimizer that updates the device design. JAX supplies automatic differentiation and acceleration, while independent gyrokinetic codes provide validation references.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#11172c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#154e70"/>
      <stop offset="1" stop-color="#293b78"/>
    </linearGradient>
    <linearGradient id="optimizer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#402a71"/>
      <stop offset="1" stop-color="#27467d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.5 L9 5 L1 8.5 Z" fill="#58d7ee"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.5 L9 5 L1 8.5 Z" fill="#b397ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.5 L9 5 L1 8.5 Z" fill="#8ee6b0"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f4f8ff; letter-spacing: -1px; }
      .subtitle { font: 400 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a9bad3; }
      .eyebrow { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2.2px; }
      .card-title { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f7faff; }
      .card-copy { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b9c8dc; }
      .chip { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dce8f7; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #91a5c2; }
      .arrow-label { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9fb4cf; letter-spacing: .2px; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="30" fill="url(#background)"/>
  <circle cx="1290" cy="-40" r="330" fill="#253a83" opacity="0.11"/>
  <circle cx="120" cy="990" r="310" fill="#0b8a9c" opacity="0.08"/>
  <path d="M40 185 H1560" stroke="#91a5c2" stroke-opacity="0.12"/>

  <text x="70" y="82" class="title">JAXFluxTubeGK</text>
  <text x="70" y="116" class="subtitle">Differentiable local flux-tube gyrokinetics in the fusion-device design loop</text>
  <g transform="translate(1215 67)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#58d7ee" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
    <text x="54" y="5" class="small">production flow</text>
    <line x1="0" y1="32" x2="40" y2="32" stroke="#b397ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
    <text x="54" y="37" class="small">validation</text>
  </g>

  <text x="70" y="222" class="eyebrow" fill="#58d7ee">DIFFERENTIABLE DESIGN LOOP</text>

  <!-- Main pipeline cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="270" width="250" height="250" rx="22" fill="#111f35" stroke="#2e4867"/>
    <rect x="370" y="270" width="260" height="250" rx="22" fill="#111f35" stroke="#2e4867"/>
    <rect x="680" y="270" width="250" height="250" rx="22" fill="#10253a" stroke="#3288a1"/>
    <rect x="980" y="245" width="300" height="300" rx="25" fill="url(#core)" stroke="#67dcf0" stroke-width="2"/>
    <rect x="1330" y="270" width="200" height="250" rx="22" fill="#111f35" stroke="#49638b"/>
  </g>

  <!-- Design card -->
  <circle cx="105" cy="310" r="17" fill="#58d7ee" opacity="0.16"/>
  <path d="M97 310h16M105 302v16" stroke="#69dff1" stroke-width="2.4" stroke-linecap="round"/>
  <text x="95" y="355" class="card-title">Device design</text>
  <text x="95" y="391" class="card-copy">Boundary shape</text>
  <text x="95" y="418" class="card-copy">Coils and currents</text>
  <text x="95" y="445" class="card-copy">Profiles and controls</text>
  <rect x="95" y="472" width="125" height="27" rx="13.5" fill="#173349"/>
  <text x="111" y="490" class="chip">design variables</text>

  <!-- MHD card -->
  <circle cx="405" cy="310" r="17" fill="#58d7ee" opacity="0.16"/>
  <path d="M397 315c4-12 12-12 16 0M399 306h12" fill="none" stroke="#69dff1" stroke-width="2.2" stroke-linecap="round"/>
  <text x="395" y="355" class="card-title">Equilibrium / MHD</text>
  <text x="395" y="391" class="card-copy">Solve magnetic equilibrium</text>
  <text x="395" y="418" class="card-copy">and expose field data</text>
  <g transform="translate(395 459)">
    <rect width="53" height="27" rx="13.5" fill="#1c314a"/><text x="12" y="18" class="chip">DESC</text>
    <rect x="61" width="73" height="27" rx="13.5" fill="#1c314a"/><text x="73" y="18" class="chip">VMEC++</text>
    <rect x="142" width="55" height="27" rx="13.5" fill="#1c314a"/><text x="154" y="18" class="chip">GVEC</text>
  </g>

  <!-- Geometry contract card -->
  <circle cx="715" cy="310" r="17" fill="#58d7ee" opacity="0.16"/>
  <path d="M708 304l14 12M722 304l-14 12" stroke="#69dff1" stroke-width="2.2" stroke-linecap="round"/>
  <text x="705" y="355" class="card-title">Geometry provider</text>
  <text x="705" y="391" class="card-copy">Versioned adapter contract</text>
  <text x="705" y="418" class="card-copy">Field-line metrics</text>
  <text x="705" y="445" class="card-copy">Normalization + provenance</text>
  <rect x="705" y="472" width="180" height="27" rx="13.5" fill="#154052"/>
  <text x="721" y="490" class="chip">in-memory geometry</text>

  <!-- Core card -->
  <circle cx="1020" cy="289" r="20" fill="#78e5f5" opacity="0.2" filter="url(#glow)"/>
  <path d="M1010 289h20M1020 279v20" stroke="#8aeafa" stroke-width="2.7" stroke-linecap="round"/>
  <text x="1005" y="340" class="card-title" style="font-size:26px">JAXFluxTubeGK</text>
  <text x="1005" y="375" class="card-copy" style="fill:#d5e7f5">Local field-aligned grids</text>
  <text x="1005" y="402" class="card-copy" style="fill:#d5e7f5">Gyrokinetic physics operators</text>
  <text x="1005" y="429" class="card-copy" style="fill:#d5e7f5">Time advance + field solves</text>
  <text x="1005" y="456" class="card-copy" style="fill:#d5e7f5">Diagnostics + objectives</text>
  <g transform="translate(1005 493)">
    <rect width="91" height="28" rx="14" fill="#102e55"/><text x="15" y="19" class="chip">JAX-native</text>
    <rect x="101" width="120" height="28" rx="14" fill="#102e55"/><text x="116" y="19" class="chip">differentiable</text>
  </g>

  <!-- Objectives card -->
  <circle cx="1365" cy="310" r="17" fill="#8ee6b0" opacity="0.16"/>
  <path d="M1357 311l6 6 11-14" fill="none" stroke="#8ee6b0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1355" y="355" class="card-title">Design metrics</text>
  <text x="1355" y="391" class="card-copy">Growth rates</text>
  <text x="1355" y="418" class="card-copy">Transport proxies</text>
  <text x="1355" y="445" class="card-copy">Physics constraints</text>
  <rect x="1355" y="472" width="129" height="27" rx="13.5" fill="#183b3d"/>
  <text x="1371" y="490" class="chip">value + gradient</text>

  <!-- Main arrows -->
  <g fill="none" stroke="#58d7ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowCyan)">
    <path d="M320 395 H356"/>
    <path d="M630 395 H666"/>
    <path d="M930 395 H966"/>
    <path d="M1280 395 H1316"/>
  </g>
  <text x="335" y="380" class="arrow-label">solve</text>
  <text x="641" y="380" class="arrow-label">adapt</text>
  <text x="940" y="380" class="arrow-label">run</text>
  <text x="1288" y="380" class="arrow-label">measure</text>

  <!-- JAX foundation -->
  <g filter="url(#shadow)">
    <rect x="995" y="135" width="270" height="70" rx="18" fill="#141f3b" stroke="#675fa2"/>
  </g>
  <text x="1020" y="166" class="card-title" style="font-size:18px">JAX ecosystem</text>
  <text x="1020" y="190" class="small">autodiff · XLA · CPU/GPU acceleration</text>
  <path d="M1130 205 V232" fill="none" stroke="#b397ff" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrowPurple)"/>

  <!-- Optimizer and feedback loop -->
  <g filter="url(#shadow)">
    <rect x="570" y="650" width="460" height="145" rx="23" fill="url(#optimizer)" stroke="#9f8ae8"/>
  </g>
  <text x="600" y="692" class="eyebrow" fill="#c4b6ff">GRADIENT-BASED SEARCH</text>
  <text x="600" y="729" class="card-title">Design optimizer</text>
  <text x="600" y="759" class="card-copy" style="fill:#d8d0f3">Aggregate objectives · enforce constraints · propose next design</text>

  <path d="M1430 520 V585 Q1430 615 1400 615 H1055 Q1025 615 1025 645" fill="none" stroke="#8ee6b0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
  <text x="1190" y="600" class="arrow-label" style="fill:#a9e9c1">objectives and sensitivities</text>
  <path d="M570 723 H365 Q195 723 195 540" fill="none" stroke="#8ee6b0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
  <text x="282" y="707" class="arrow-label" style="fill:#a9e9c1">update parameters</text>

  <!-- Validation lane -->
  <text x="1070" y="688" class="eyebrow" fill="#b397ff">INDEPENDENT VALIDATION</text>
  <g filter="url(#shadow)">
    <rect x="1070" y="715" width="220" height="145" rx="20" fill="#161d35" stroke="#665b9b"/>
    <rect x="1330" y="715" width="200" height="145" rx="20" fill="#161d35" stroke="#665b9b"/>
  </g>
  <text x="1095" y="755" class="card-title" style="font-size:19px">Reference GK codes</text>
  <text x="1095" y="790" class="card-copy">stella · GX</text>
  <text x="1095" y="817" class="card-copy">GKW · Gyaradax</text>
  <text x="1355" y="755" class="card-title" style="font-size:19px">Parity gates</text>
  <text x="1355" y="790" class="card-copy">Fixtures</text>
  <text x="1355" y="817" class="card-copy">Convergence · traces</text>
  <path d="M1290 787 H1316" fill="none" stroke="#b397ff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arrowPurple)"/>
  <path d="M1430 715 V650 Q1430 625 1405 625 H1160 Q1130 625 1130 558" fill="none" stroke="#b397ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" marker-end="url(#arrowPurple)"/>

  <!-- Footer contract -->
  <rect x="70" y="905" width="1460" height="1" fill="#7d91ae" opacity="0.18"/>
  <circle cx="82" cy="946" r="5" fill="#58d7ee"/>
  <text x="98" y="951" class="small">MHD solvers are optional geometry providers</text>
  <circle cx="475" cy="946" r="5" fill="#b397ff"/>
  <text x="491" y="951" class="small">Reference GK codes are validation tools, not runtime dependencies</text>
  <circle cx="1040" cy="946" r="5" fill="#8ee6b0"/>
  <text x="1056" y="951" class="small">No equilibrium artifacts are required in the repository</text>
</svg>
