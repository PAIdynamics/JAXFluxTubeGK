###############################################################################
# Unit testing (CPU)
###############################################################################

utest-cpu-debug-gnu-coverage:
  extends: .unit_test_template
  except:
    - schedules
  tags:
    - cpu
    - perl
  variables:
    BUILD_TYPE: "debug"
    COMPILER_VENDOR: "gnu"
    TEST_NAME: "utest"
    COVERAGE: "true"
  dependencies:
    - build-debug-gnu-coverage
  needs: ["build-debug-gnu-coverage"]
  artifacts:
    paths:
      - public

utest-cpu-release-gnu:
  extends: .unit_test_template
  except:
    - schedules
  tags:
    - cpu
  variables:
    BUILD_TYPE: "release"
    COMPILER_VENDOR: "gnu"
    TEST_NAME: "utest"
  dependencies:
    - build-release-gnu
  needs: ["build-release-gnu"]

utest-cpu-debug-intel:
  extends: .unit_test_template
  except:
    - schedules
  tags:
    - cpu
  variables:
    BUILD_TYPE: "debug"
    COMPILER_VENDOR: "intel"
    TEST_NAME: "utest"
  dependencies:
    - build-debug-intel
  needs: ["build-debug-intel"]

utest-cpu-release-intel:
  extends: .unit_test_template
  except:
    - schedules
  tags:
    - cpu
  variables:
    BUILD_TYPE: "release"
    COMPILER_VENDOR: "intel"
    TEST_NAME: "utest"
  dependencies:
    - build-release-intel
  needs: ["build-release-intel"]

