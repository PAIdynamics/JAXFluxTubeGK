[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarator-gk"
version = "0.1.0"
description = "Differentiable flux-tube stellarator gyrokinetic solver"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "pytest>=8",
  "ruff>=0.6",
]
reference = [
  "einops>=0.8",
  "omegaconf>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stellarator_gk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not external'"
markers = [
  "external: requires an explicitly configured, revision-pinned external dependency",
]

[tool.ruff]
line-length = 100
