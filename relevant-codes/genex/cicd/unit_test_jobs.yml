###############################################################################
# Redacted release version testing
###############################################################################

utest-release-intel-redact:
  extends: .unit_test_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: never
    - when: always
  tags:
    - cpu
  variables:
    BUILD_TYPE: "release"
    COMPILER_VENDOR: "intel"
    TEST_NAME: "utest"
    REDACT: "true"
  dependencies:
    - build-release-intel
  needs: ["build-release-intel"]
