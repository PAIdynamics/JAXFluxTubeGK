name: CI

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run --no-sync ruff check src tests examples scripts
      - run: JAX_ENABLE_X64=1 uv run --no-sync pytest
      - run: uv run --no-sync python scripts/package_smoke_test.py --python 3.13
